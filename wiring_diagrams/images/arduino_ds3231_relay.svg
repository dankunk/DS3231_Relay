2" text-anchor="start" fill="#444" font-weight="normal">USB port: plug in a laptop to sync the clock.</text><text x="56" y="302" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#444" font-weight="normal">laptop</text><text x="640" y="703" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#d62728" font-weight="bold">Check the battery-charging warning in the docs</text><text x="640" y="720" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#d62728" font-weight="bold">before powering a blue ZS-042 module from 5 V.</text></svg>
