<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470"><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#555"/></marker></defs><rect width="1040" height="470" fill="#ffffff"/><text x="520.0" y="34" font-family="Helvetica, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#222" font-weight="bold">How the system works</text><rect x="30" y="60" width="370" height="330" rx="14" fill="#f3f8ff" stroke="#9bb7e0" stroke-width="1.5" stroke-dasharray="6 4"/><text x="215" y="88" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">① About once a year: sync from a laptop</text><rect x="70" y="115" width="140" height="66" rx="30" fill="#e8eef7" stroke="#888" stroke-width="1.5"/><text x="140" y="143" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">Internet</text><text x="140" y="161" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">time server (NTP)</text><rect x="70" y="250" width="160" height="90" rx="8" fill="#5b6470" stroke="#333" stroke-width="1.5"/><text x="150" y="288" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">Laptop</text><text x="150" y="308" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e6e9ee" font-weight="normal">sync_rtc.py</text><line x1="140" y1="183" x2="147" y2="245" stroke="#555" stroke-width="3" marker-end="url(#ah)"/><text x="152" y="220" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222" font-weight="normal">exact time</text><text x="215" y="368" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555" font-weight="normal">No internet? It falls back to the laptop clock.</text><line x1="232" y1="295" x2="476" y2="295" stroke="#555" stroke-width="4" marker-end="url(#ah)"/><text x="330" y="282" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">USB cable</text><text x="330" y="316" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">few-ms delay,</text><text x="330" y="330" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">compensated</text><rect x="430" y="60" width="580" height="330" rx="14" fill="#f4fbf4" stroke="#9ccc9c" stroke-width="1.5" stroke-dasharray="6 4"/><text x="720" y="88" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">② On campus, all the time (no Wi-Fi needed)</text><rect x="480" y="110" width="140" height="80" rx="8" fill="#1d4e89" stroke="#333" stroke-width="1.5"/><text x="550" y="145" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">DS3231</text><text x="550" y="165" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#dbe7f7" font-weight="normal">holds UTC</text><rect x="480" y="250" width="140" height="90" rx="8" fill="#00878f" stroke="#333" stroke-width="1.5"/><text x="550" y="285" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">Arduino</text><text x="550" y="303" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#d9f4f5" font-weight="normal">UTC → local</text><text x="550" y="318" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#d9f4f5" font-weight="normal">+ auto DST</text><line x1="550" y1="192" x2="550" y2="248" stroke="#555" stroke-width="3"/><text x="560" y="225" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#222" font-weight="normal">I²C (wired permanently)</text><rect x="700" y="255" width="100" height="80" rx="8" fill="#2b2b2b" stroke="#333" stroke-width="1.5"/><text x="750" y="290" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">IoT</text><text x="750" y="308" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">Relay</text><line x1="622" y1="295" x2="696" y2="295" stroke="#555" stroke-width="3" marker-end="url(#ah)"/><text x="659" y="285" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">pin 8</text><rect x="860" y="262" width="125" height="66" rx="8" fill="#fff7d6" stroke="#e0a100" stroke-width="2"/><text x="922" y="290" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">Grow lights</text><text x="922" y="307" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555" font-weight="normal">Normally OFF outlet</text><line x1="802" y1="295" x2="856" y2="295" stroke="#555" stroke-width="3" marker-end="url(#ah)"/><text x="720" y="368" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333" font-weight="normal">The Arduino adds −7 h (MST) or −6 h (MDT) by itself.</text><text x="520" y="430" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">The RTC never changes for daylight saving. Only the Arduino's math does, so no March/November visits.</text></svg>
